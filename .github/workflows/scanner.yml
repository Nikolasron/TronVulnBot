name: TronVulnBot

on:
  schedule:
    - cron: '*/15 * * * *' # Every 15 mins
  workflow_dispatch:

# This is the crucial fix. It allows the bot to push the JSON file back.
permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with: { python-version: '3.10' }
      
      - run: pip install requests
      
      - run: python scanner.py
        env:
          TRONSCAN_API_KEY: ${{ secrets.TRONSCAN_API_KEY }}
      
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add flagged_contracts.json
          # Only commit if there are changes
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update: New vulnerable contracts" && git push)
