name: TRON Vulnerability Scanner

on:
  schedule:
    # Runs every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch: # Allows you to run it manually by clicking a button

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Scanner
        env:
          TRONGRID_API_KEY: ${{ secrets.TRONGRID_API_KEY }}
          TRONSCAN_API_KEY: ${{ secrets.TRONSCAN_API_KEY }}
        run: python scanner.py

      - name: Commit and Push Results
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "GitHub Action Bot"
          git add flagged_contracts.json
          # Only commit if there are changes
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update: New vulnerable contracts found" && git push)
